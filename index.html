</section>
      <script>
  function updateNavbar() {
    const isLoggedIn = localStorage.getItem("isLoggedIn");
    const email = localStorage.getItem("loggedInEmail");
    const user = email ? { email: email } : JSON.parse(localStorage.getItem("user"));
    const authSection = document.getElementById("auth-section");

    if (isLoggedIn === "true" && user) {
      const initial = user.email.charAt(0).toUpperCase();
      authSection.innerHTML = `
        <div style="display:flex; align-items:center; gap:10px;">
          <div style="width:36px; height:36px; border-radius:50%; background:#2563eb;
                      display:flex; align-items:center; justify-content:center;
                      color:white; font-size:14px; font-weight:600;">
            ${initial}
          </div>
          <span style="font-size:13px; color:#374151; max-width:140px;
          overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
            ${user.email}
          </span>
          <button onclick="logout()"
                  style="font-size:12px; padding:5px 12px; border-radius:9999px;
                  border:1px solid #d1d5db; cursor:pointer; background:white;
                  color:#6b7280;"
                  onmouseover="this.style.borderColor='#2563eb';this.style.color='#2563eb';"
                  onmouseout="this.style.borderColor='#d1d5db';this.style.color='#6b7280';">
            Logout
          </button>
        </div>`;
    }
  }

  function logout() {
    localStorage.removeItem("isLoggedIn");
    window.location.reload();
  }

  function checkLoginAndRedirect(page) {
    const isLoggedIn = localStorage.getItem("isLoggedIn");
    if (isLoggedIn === "true") {
      window.location.href = page;
    } else {
      alert("Please login first");
      window.location.href = "login.html";
    }
  }

  updateNavbar();
</script>
